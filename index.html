<style>
:root{--ink:#1b1340;--pink:#ff3d81;--yellow:#ffe23d;--mint:#3dffc0;--paper:#f6f1ff}
body{font-family:'Space Grotesk',sans-serif;font-weight:500;color:var(--ink);overflow-x:hidden;background:#3a1bb3}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(rgba(255,255,255,.15) 2px,transparent 2.5px) 0 0/26px 26px,linear-gradient(160deg,#5a35f0,#3a1bb3 60%,#2a1090)}
.orb{font-family:'Lilita One',sans-serif;font-weight:400;letter-spacing:.02em}
.title{text-shadow:3px 3px 0 var(--pink),6px 6px 0 #000}
.sticker{background:#fff;color:var(--ink);border:3px solid #000;border-radius:18px;box-shadow:5px 5px 0 #000}
.panel{background:var(--paper);color:var(--ink);border:3px solid #000;border-radius:24px;box-shadow:7px 7px 0 #000}
.panel.dark{background:var(--ink);color:#fff}
.btn{border:3px solid #000;border-radius:16px;box-shadow:5px 5px 0 #000;transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #000}
.card{background:#fff;color:var(--ink);border:3px solid #000;border-radius:14px;padding:6px;text-align:left;box-shadow:3px 3px 0 #000;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translate(-1px,-2px) rotate(-1deg);box-shadow:5px 5px 0 #000}
.card.on{background:var(--pink);color:#fff;transform:rotate(-1.5deg);box-shadow:5px 5px 0 #000}
.marquee:fullscreen{display:flex;align-items:center;justify-content:center;border-radius:0}.marquee:fullscreen>.vwrap{width:min(100%,calc((100vh - 44px)*16/9))}
.marquee{position:relative;padding:18px;background:var(--pink);border:4px solid #000;border-radius:30px;box-shadow:8px 8px 0 #000}
.marquee::before{content:"";position:absolute;inset:4px;padding:8px;border-radius:26px;pointer-events:none;background:radial-gradient(circle,var(--yellow) 3.5px,transparent 4.5px) 0 0/22px 22px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:bulbs 1.2s steps(2) infinite}
@keyframes bulbs{50%{opacity:.35}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.flash{animation:flash .6s ease-out}
@keyframes pop{0%{transform:scale(2.2);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .5s ease-out}
.cdnum{color:var(--yellow);-webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:8px 8px 0 var(--pink)}
.tab{border:3px solid #000;border-radius:12px;padding:6px;font-family:'Lilita One',sans-serif;background:#fff;box-shadow:3px 3px 0 #000;transition:transform .08s,box-shadow .08s}
.tab.on{background:var(--yellow)}
.tab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.scroll{scrollbar-width:thin;scrollbar-color:#000 transparent}
@media (prefers-reduced-motion:reduce){.marquee::before,.pop{animation:none}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
</style>

}

// ---------- SCORING ----------
const W = {le:2, re:2, lw:2, rw:2};
function fromLm(lm, r) {
  const u = {};
  KEYS.forEach((k, i) => { const p = lm[IDX[i]]; if (p && (p.visibility ?? 1) > .4) u[k] = [(r.x + (1 - p.x) * r.w) / 1280, (r.y + p.y * r.h) / 720]; });
  return u;
}
function calc(u, t, o, lenient) {
  if (!u.ls || !u.rs) return null;
  // FIX 1: haath/kohni dikh nahi rahe to score nahi milega
  if (!lenient && (!u.le || !u.re || !u.lw || !u.rw)) return null;
  // Body shoulder-center pe anchor + shoulder-width se scale => kahin bhi khade ho, score sahi aayega
  const nm = p => {
    const mx = (p.ls[0] + p.rs[0]) / 2 * AR, my = (p.ls[1] + p.rs[1]) / 2;
    const sw = Math.max(Math.hypot((p.rs[0] - p.ls[0]) * AR, p.rs[1] - p.ls[1]), .12);
    return k => [(p[k][0] * AR - mx) / sw, (p[k][1] - my) / sw];
  };
  const fu = nm(u), ft = nm(t); let d = 0, n = 0;
  KEYS.forEach(k => {
    if (!u[k] && lenient && W[k]) { d += W[k]; n += W[k]; }
    if (u[k]) { const a = fu(k), b = ft(k), w = W[k] || 1, e = Math.hypot(a[0] - b[0], a[1] - b[1]); d += w * e; n += w; if (o) o[k] = e; }
  });
  return Math.max(0, Math.min(100, Math.round(100 * (1 - Math.max(0, d / n - .12) / .55))));
}
function updateHUD(seen, cnt) {
  const s = Math.round(score);
  $('pct').textContent = s + '%';
  $('ring').style.strokeDashoffset = 163.36 * (1 - s / 100);
  const st = $('status');
  if (!seen) { st.textContent = cnt === 2 ? 'HAATH DIKHAO 🙌' : cnt >= 0 ? cnt + '/2 LOG DIKH RAHE 👫' : 'FRAME ME AAO 👀'; st.className = 'orb font-bold text-xs text-slate-400'; }
  else if (s >= 80) { st.textContent = 'PERFECT! 🔥'; st.className = 'orb font-bold text-xs text-green-400 animate-pulse'; }
  else if (s >= 55) { st.textContent = 'KAREEB HO...'; st.className = 'orb font-bold text-xs text-yellow-400'; }
  else { st.textContent = 'PEELE SKELETON ME FIT HO'; st.className = 'orb font-bold text-xs text-cyan-400'; }
}

// ---------- DRAW LOOP ----------
function overlay(users) {
  const w = cv.width, h = cv.height, cur = POSES[sel], tpls = cur.duo ? [cur.pts, cur.pts2] : [cur.pts], now = performance.now(), dt = now - lastT; lastT = now;
  ctx.shadowBlur = 0;
  tpls.forEach((t, i) => guide(ctx, t, w, h, okState[i] || {}, cur.duo ? .88 : 1));
  ctx.shadowBlur = 0;
  const sw = u => Math.abs(u.rs[0] - u.ls[0]);
  const list = users.filter(u => u.ls && u.rs).sort((a, b) => sw(b) - sw(a)).slice(0, tpls.length).sort((a, b) => (a.ls[0] + a.rs[0]) - (b.ls[0] + b.rs[0]));
  list.forEach(u => fig(ctx, u, w, h, {col: '#3dffc0', lw: h / 110, r: h * .05, dot: '#ff3d81'}));
  lastList = list; okState = [];
  let s = null;
  if (list.length === tpls.length) { const sc = list.map((u, i) => { okState[i] = {}; return calc(u, tpls[i], okState[i], cur.duo); }); if (sc.every(x => x !== null)) s = sc.reduce((a, b) => a + b) / sc.length; }
  if (s === null) score *= .9; else { score = score * .6 + s * .4; lastSeen = now; }
  const seen = now - lastSeen < 1000;
  updateHUD(seen, cur.duo ? list.length : -1);
  // FIX 2: now > noSnapUntil  |  match hone par hold badhta hai, nahi to dheere ghatta hai
  if ($('autoChk').checked && !counting && !modalOpen && now > noSnapUntil && seen && score >= MATCH_MIN) hold += dt; else hold = Math.max(0, hold - dt * 2);
  // FIX 3: bar HOLD_MS se match karta hai
  $('holdBar').style.width = Math.min(100, hold / HOLD_MS * 100) + '%';
  if (hold >= HOLD_MS) { hold = 0; startCountdown(); }   // match hote hi 3-2-1 timer, phir photo
  if (booth) boothTick(now, dt, seen);
}
function onFrame(lms) {
  if (mock) return;
  if (!ready) { ready = true; hideOverlay(); }
  if (cv.width !== 1280 || cv.height !== 720) { cv.width = 1280; cv.height = 720; }
  drawVid(ctx, 1280, 720);
  const r = vidRect(1280, 720);
  overlay(lms.map(l => fromLm(l, r)));
}
function mockLoop(t) {
  if (!mock) return;
  const w = cv.width, h = cv.height, cur = POSES[sel];
  const amp = .01 + .09 * (Math.sin(t / 2500) + 1) / 2;
  const us = (cur.duo ? [cur.pts, cur.pts2] : [cur.pts]).map(tpl => { const u = {}; KEYS.forEach((k, i) => { u[k] = [tpl[k][0] + Math.sin(t / 300 + i) * amp, tpl[k][1] + Math.cos(t / 370 + i * 2) * amp]; }); return u; });
  const g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#0f172a'); g.addColorStop(1, '#3b0a3f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(6,182,212,.15)'; ctx.lineWidth = 2;
  for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.font = 'bold 26px Lilita One,sans-serif'; ctx.fillStyle = '#ec4899';
  ctx.fillText('🎮 DEMO MODE (bina webcam)', 40, h - 70);
  overlay(us);
  requestAnimationFrame(mockLoop);
}

// ---------- CAMERA ----------
const TV = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_' + POSE_MODEL + '/float16/1/pose_landmarker_' + POSE_MODEL + '.task';
let lmk = null, lastVT = -1;
async function initPose() {
  if (lmk) return;
  const {PoseLandmarker, FilesetResolver} = await import(TV + '/vision_bundle.mjs');
  const fs = await FilesetResolver.forVisionTasks(TV + '/wasm');
  const mk = d => PoseLandmarker.createFromOptions(fs, {baseOptions: {modelAssetPath: MODEL, delegate: d}, runningMode: 'VIDEO', numPoses: 2, minPoseDetectionConfidence: .4, minPosePresenceConfidence: .4, minTrackingConfidence: .4});
  try { lmk = await mk('GPU'); } catch (e) { lmk = await mk('CPU'); }
}
function stopStream() { token++; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
async function loop(id) {
  while (id === token && stream) {
    if (lmk && video.readyState >= 2 && video.currentTime !== lastVT) {
      lastVT = video.currentTime;
      try { onFrame(lmk.detectForVideo(video, performance.now()).landmarks); } catch (e) { console.warn(e); }
    }
    await new Promise(r => requestAnimationFrame(r));
  }
}
async function listCams() {
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const s = $('camSel'); s.innerHTML = '';
    cams.forEach((d, i) => s.add(new Option(d.label || 'Camera ' + (i + 1), d.deviceId)));
    const cur = stream && stream.getVideoTracks()[0].getSettings().deviceId; if (cur) s.value = cur;
    s.classList.toggle('hidden', cams.length < 2);
  } catch (e) {}
}
async function startCamera(deviceId) {
  mock = false; stopStream(); ready = false; $('demoBtn').textContent = '🎮 Demo';
  setOverlay('📷 CAMERA CHALU HO RAHA HAI...', 'Browser permission maange toh "Allow" dabao.', false);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return setOverlay('CAMERA SUPPORT NAHI', 'Page ko https:// ya localhost par kholo (Live Server use karo).', true);
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: deviceId ? {deviceId: {exact: deviceId}, width: {ideal: 1920}, height: {ideal: 1080}, aspectRatio: {ideal: 16/9}} : {facingMode: 'user', width: {ideal: 1920}, height: {ideal: 1080}, aspectRatio: {ideal: 16/9}}, audio: false});
    video.srcObject = stream; await video.play(); listCams();
    setOverlay('🧠 AI MODEL LOAD HO RAHA HAI...', 'Pehli baar thoda time lagta hai (internet chahiye).', false);
    try { await Promise.race([initPose(), new Promise((_, rj) => setTimeout(() => rj(new Error('MP')), 40000))]); } catch (x) { console.warn(x); throw new Error('MP'); }
    loop(token);
  } catch (e) {
    stopStream();
    setOverlay(e.message === 'MP' ? 'AI LIBRARY LOAD NAHI HUI' : 'CAMERA NAHI MILA',
      e.message === 'MP' ? 'Internet check karo aur page reload karo.' :
      e.name === 'NotAllowedError' ? 'Permission block hai – address bar ke camera icon se Allow karo.' : 'Webcam check karo ya Demo Mode try karo.', true);
  }
}
function startDemo() {
  stopStream(); mock = true; ready = true; hideOverlay();
  cv.width = 1280; cv.height = 720; $('demoBtn').textContent = '📷 Camera';
  requestAnimationFrame(mockLoop);
}

// Manual button / Space: 3-2-1 countdown, phir photo
function startCountdown(done = snap) {
  if (counting || modalOpen) return;
  if (!mock && performance.now() - lastSeen > 1200) return toast(POSES[sel].duo ? 'Dono log frame me aao! 👫' : 'Koi dikha nahi! 👀 Camera ke saamne aao');
  counting = true;
  const box = $('cdBox'), num = $('cdNum'); box.style.opacity = 1;
  let c = 3;
  const show = () => { $('cdTxt').textContent = 'POSE HOLD KARO!'; num.textContent = c; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); beep(700, .15); };
  show();
  const iv = setInterval(() => {
    c--;
    if (c > 0) show(); else { clearInterval(iv); box.style.opacity = 0; done(); }
  }, 1000);
}
function snap() {
  const f = $('flashOverlay'); f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash');
  beep(1200, .3);
  const fs = Math.round(score);
  drawSnapshot(fs);
  if (fs >= 70) fire({colors: ['#ff3d81','#ffe23d','#3dffc0','#ffffff'], particleCount: 140, spread: 80, origin: {y: .6}});
  setTimeout(() => showModal(fs), 450);
}
function drawSnapshot(fs) {
  const sc = $('snapCanvas'), c = sc.getContext('2d'), w = sc.width = cv.width || 1280, h = sc.height = cv.height || 720, p = POSES[sel];
  if (!mock && video.videoWidth) drawVid(c, w, h);
  else c.drawImage(cv, 0, 0, w, h);
  const g = c.createLinearGradient(0, h * .76, 0, h); g.addColorStop(0, 'rgba(2,6,23,0)'); g.addColorStop(1, 'rgba(2,6,23,.92)');
  c.fillStyle = g; c.fillRect(0, h * .76, w, h * .24);
  c.fillStyle = '#fff'; c.font = `900 ${h * .055}px Lilita One,sans-serif`; c.fillText(p.emoji + ' ' + p.name, w * .03, h * .92);
  c.fillStyle = '#3dffc0'; c.font = `700 ${h * .04}px Space Grotesk,sans-serif`;
  c.fillText((($('playerName').value.trim()) || 'Player') + '  |  COLLEGE FEST 2026', w * .03, h * .97);
  c.fillStyle = '#ff3d81'; c.beginPath(); c.roundRect(w * .79, h * .05, w * .18, h * .13, 18); c.fill();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = `900 ${h * .075}px Lilita One,sans-serif`; c.fillText(fs + '%', w * .88, h * .145); c.textAlign = 'left';
  c.lineWidth = 14; c.strokeStyle = '#ffe23d'; c.strokeRect(7, 7, w - 14, h - 14);
}

// ---------- USER-MADE POSES ----------
const saveCustom = () => { try { localStorage.setItem('poseoff_custom_v1', JSON.stringify(POSES.filter(p => p.custom))); } catch (e) {} };
// user ke body points ko target-pose template me badalta hai (jo point nahi dikha, use body ke hisaab se bhar deta hai)
function toTemplate(u) {
  const f = Math.max(Math.abs(u.rs[0] - u.ls[0]), .05) / .16, cx = (u.ls[0] + u.rs[0]) / 2, cy = (u.ls[1] + u.rs[1]) / 2, o = {};
  KEYS.forEach(k => {
    const q = u[k] || [cx + (BASE[k][0] - .5) * f, cy + (BASE[k][1] - .30) * f];
    o[k] = [Math.min(1, Math.max(0, q[0])), Math.min(1, Math.max(0, q[1]))];
  });
  return o;
}
const uniq = base => { let t = base, i = 2; while (POSES.some(q => q.name === t)) t = base + ' ' + i++; return t; };
function createPose() {
  if (counting || modalOpen) return;
  const duo = tab === 'duo', need = duo ? 2 : 1;
  startCountdown(() => {
    counting = false;
    const L = lastList.filter(u => ['ls','rs','le','re','lw','rw'].every(k => u[k]));
    if (L.length < need) return toast(duo ? 'Dono log poore frame me aao (haath dikhne chahiye)! 👫' : 'Haath poore dikhne chahiye – thoda peeche hato! 👀');
    const nm = $('playerName').value.trim();
    const p = {name: uniq(nm ? nm.toUpperCase().slice(0, 14) + ' POSE' : 'MY POSE'), emoji: '✨', tip: 'Ye pose kisi ne banaya hai – copy karke dikhao!', custom: true, duo, pts: toTemplate(L[0])};
    if (duo) p.pts2 = toTemplate(L[1]);
    POSES.push(p); saveCustom(); selectPose(POSES.length - 1);
    noSnapUntil = performance.now() + 3000;   // apna hi pose perfect match hota hai, isliye turant photo nahi
    beep(1000, .2); fire({particleCount: 60, spread: 60, origin: {y: .6}});
    toast('✨ Pose save ho gaya! Ab koi bhi copy kar sakta hai');
  });
}
function deletePose() {

  const nm = POSES[sel].name; delete refStore[nm]; delete refImgs[nm];
  try { localStorage.setItem(REF_KEY, JSON.stringify(refStore)); } catch (e) {}

// ---------- CLEAR TARGET GUIDE ----------
// Mota colored body: HAATH = pink, PAIR = blue, DHAD = yellow. Circle HARA ho jaye = wo jagah sahi hai.
function guide(c, p, w, h, ok, sc) {
  const arm = ['le','re','lw','rw'], leg = ['lk','rk','la','ra'];
  c.lineCap = 'round'; c.lineJoin = 'round'; c.setLineDash([]);
  BONES.forEach(b => {
    if (!p[b[0]] || !p[b[1]]) return;
    c.beginPath(); c.moveTo(p[b[0]][0] * w, p[b[0]][1] * h); c.lineTo(p[b[1]][0] * w, p[b[1]][1] * h);
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = h / 36 * sc; c.stroke();
    c.strokeStyle = b.some(k => arm.includes(k)) ? 'rgba(255,61,129,.6)' : b.some(k => leg.includes(k)) ? 'rgba(76,201,255,.6)' : 'rgba(255,226,61,.6)';
    c.lineWidth = h / 58 * sc; c.stroke();
  });
  if (p.n) { c.beginPath(); c.arc(p.n[0] * w, p.n[1] * h, h * .05 * sc, 0, 7); c.fillStyle = 'rgba(255,226,61,.6)'; c.fill(); c.strokeStyle = 'rgba(0,0,0,.7)'; c.lineWidth = 4; c.stroke(); }
  [...arm, ...leg].forEach(k => {
    if (!p[k]) return;
    c.beginPath(); c.arc(p[k][0] * w, p[k][1] * h, h * .028 * sc, 0, 7);
    c.fillStyle = ok[k] < .45 ? '#3dffc0' : '#fff'; c.fill(); c.strokeStyle = '#000'; c.lineWidth = 4; c.stroke();

}
function drawVid(c, W, H) {
  const r = vidRect(W, H); c.fillStyle = '#1b1340'; c.fillRect(0, 0, W, H);
  c.save(); c.translate(r.x + r.w, r.y); c.scale(-1, 1); c.drawImage(video, 0, 0, r.w, r.h); c.restore();
}

// ---------- REAL REFERENCE PHOTOS ----------
// Priority: 1) photo jo app me lagayi  2) poses/<pose-name>.jpg|png|webp folder  3) cartoon figure
const REF_KEY = 'poseoff_ref_v1', slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
let refStore = {}, refImgs = {};
try { refStore = JSON.parse(localStorage.getItem(REF_KEY)) || {}; } catch (e) {}
function refLoad(p) {
  if (p.name in refImgs) return refImgs[p.name];
  refImgs[p.name] = null;
  const urls = [refStore[p.name], REF_PHOTOS[slug(p.name)], ...['jpg','png','jpeg','webp'].map(x => 'poses/' + slug(p.name) + '.' + x)].filter(Boolean);
  const next = () => { const u = urls.shift(); if (!u) return; const im = new Image(); im.onload = () => { refImgs[p.name] = im; if (POSES[sel] === p) drawRef(); }; im.onerror = next; im.src = u; };
  next(); return null;
}
function refSet(url, p = POSES[sel]) {
  refStore[p.name] = url;
  try { localStorage.setItem(REF_KEY, JSON.stringify(refStore)); } catch (e) { toast('Photo save nahi hui (jagah kam hai)'); }
  delete refImgs[p.name]; drawRef();
}

// ---------- PINNED REFERENCE PICTURE ----------
// Pose ki saaf tasveer (chehra, haath, pair) - padhne ki zarurat nahi
function human(c, f, k) {
  c.lineCap = c.lineJoin = 'round';
  const line = (a, b, col, wd) => { if (!f[a] || !f[b]) return; c.beginPath(); c.moveTo(f[a][0], f[a][1]); c.lineTo(f[b][0], f[b][1]); c.strokeStyle = '#000'; c.lineWidth = wd + 6; c.stroke(); c.strokeStyle = col; c.lineWidth = wd; c.stroke(); };
  [['lh','lk'],['lk','la'],['rh','rk'],['rk','ra']].forEach(([a, b]) => line(a, b, '#4cc9ff', k * .06));
  c.beginPath(); ['ls','rs','rh','lh'].forEach((n, i) => i ? c.lineTo(f[n][0], f[n][1]) : c.moveTo(f[n][0], f[n][1])); c.closePath();
  c.fillStyle = '#ffe23d'; c.fill(); c.strokeStyle = '#000'; c.lineWidth = 5; c.stroke();
  const [hx, hy] = f.n, r = k * .075;
  c.beginPath(); c.arc(hx, hy, r, 0, 7); c.fillStyle = '#ffd9a8'; c.fill(); c.lineWidth = 5; c.stroke();
  c.fillStyle = '#000'; [-1, 1].forEach(d => { c.beginPath(); c.arc(hx + d * r * .38, hy - r * .1, r * .11, 0, 7); c.fill(); });
  c.beginPath(); c.arc(hx, hy + r * .1, r * .45, .15 * Math.PI, .85 * Math.PI); c.lineWidth = 3; c.stroke();
  [['ls','le'],['le','lw'],['rs','re'],['re','rw']].forEach(([a, b]) => line(a, b, '#ff3d81', k * .055));
  ['lw','rw'].forEach(n => { c.beginPath(); c.arc(f[n][0], f[n][1], k * .042, 0, 7); c.fillStyle = '#fff'; c.fill(); c.strokeStyle = '#000'; c.lineWidth = 4; c.stroke(); });
}
function drawRef() {
  const cr = $('refCv'), c = cr.getContext('2d'), S = cr.width, p = POSES[sel], fs = p.duo ? [p.pts, p.pts2] : [p.pts];
  c.clearRect(0, 0, S, S);
  const im = refLoad(p);
  if (im) { const q = Math.min(S / im.width, S / im.height); c.drawImage(im, (S - im.width * q) / 2, (S - im.height * q) / 2, im.width * q, im.height * q); return; }
  let x0 = 9, y0 = 9, x1 = -9, y1 = -9;
  fs.forEach(f => KEYS.forEach(q => { x0 = Math.min(x0, f[q][0] * AR); x1 = Math.max(x1, f[q][0] * AR); y0 = Math.min(y0, f[q][1]); y1 = Math.max(y1, f[q][1]); }));
  const m = .1, k = S * .94 / Math.max(x1 - x0 + 2 * m, y1 - y0 + 2 * m), ox = (S - (x1 - x0) * k) / 2 - x0 * k, oy = (S - (y1 - y0) * k) / 2 - y0 * k;
  fs.forEach(f => { const q = {}; KEYS.forEach(n => q[n] = [f[n][0] * AR * k + ox, f[n][1] * k + oy]); human(c, q, k); });
  c.font = `${S * .16}px sans-serif`; c.textBaseline = 'top'; c.fillText(p.emoji, 8, 6); c.textBaseline = 'alphabetic';
}

// ---------- 5 POSE CHALLENGE ----------
const BOOTH_N = 5, ROUND_MS = 6000;
let booth = null;
function cd(big, txt) {
  const n = $('cdNum'); n.textContent = big; $('cdTxt').textContent = txt;
  n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop'); $('cdBox').style.opacity = 1;
}
function flash() { const f = $('flashOverlay'); f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash'); }
function boothHud() {
  const b = booth, el = $('boothHud');
  if (!b) return el.classList.add('hidden');
  el.classList.remove('hidden');
  el.textContent = `POSE ${Math.min(b.shots.length + 1, BOOTH_N)}/${BOOTH_N}  ${'●'.repeat(b.shots.length)}${'○'.repeat(BOOTH_N - b.shots.length)}` + (b.ph === 'round' ? `  ⏱ ${Math.ceil((ROUND_MS - b.t) / 1000)}s` : '');
}
function grab() {   // camera ka seedha (mirror) frame, bina skeleton ke
  const c = document.createElement('canvas'); c.width = 640; c.height = 360; const x = c.getContext('2d');
  if (!mock && video.videoWidth) drawVid(x, 640, 360); else x.drawImage(cv, 0, 0, 640, 360);
  return c;
}
function startBooth() {
  if (counting || modalOpen) return;
  if (!mock && performance.now() - lastSeen > 1200) return toast(tab === 'duo' ? 'Dono log frame me aao! 👫' : 'Pehle camera ke saamne aao! 👀');
  const duo = tab === 'duo', pool = POSES.map((p, i) => i).filter(i => !!POSES[i].duo === duo);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  booth = {q: pool.slice(0, BOOTH_N), shots: [], ph: 'ready', t: 0, c: 0, hold: 0};
  counting = true; hold = 0; selectPose(booth.q[0], true);
  $('boothBtn').textContent = '⏹ STOP';
}
function stopBooth() {
  booth = null; counting = false; $('boothBtn').textContent = '🎞️ 5 POSE CHALLENGE';
  boothHud(); $('cdBox').style.opacity = 0; $('holdBar').style.width = 0; noSnapUntil = performance.now() + 1500;
}
function boothTick(now, dt, seen) {
  const b = booth, cur = POSES[sel], thr = MATCH_MIN;
  b.t += dt;
  if (b.ph === 'ready') {
    const c = 3 - Math.floor(b.t / 1000);
    if (c !== b.c) { b.c = c; if (c > 0) { cd(c, 'POSE 1: ' + cur.emoji + ' ' + cur.name); beep(700, .15); } }
    if (b.t >= 3000) { b.ph = 'round'; b.t = 0; b.hold = 0; $('cdBox').style.opacity = 0; beep(1000, .2); }
  } else if (b.ph === 'round') {
    if (seen && score >= thr) b.hold += dt; else b.hold = Math.max(0, b.hold - dt * 2);
    $('holdBar').style.width = Math.max(0, 100 - b.t / ROUND_MS * 100) + '%';
    if (b.hold >= 600 || b.t >= ROUND_MS) {   // pose match hua ya time khatam
      b.shots.push({img: grab(), s: Math.round(score), p: cur});
      flash(); beep(1200, .25);
      if (b.shots.length === BOOTH_N) return finishBooth();
      b.ph = 'next'; b.t = 0; selectPose(b.q[b.shots.length], true);
      const nx = POSES[sel]; cd(nx.emoji, 'AGLA POSE: ' + nx.name);
    }
  } else if (b.t >= 1100) { b.ph = 'round'; b.t = 0; b.hold = 0; $('cdBox').style.opacity = 0; }
  boothHud();
}
function finishBooth() {
  const sh = booth.shots, avg = Math.round(sh.reduce((a, x) => a + x.s, 0) / sh.length);
  booth = null; $('boothBtn').textContent = '🎞️ 5 POSE CHALLENGE';
  boothHud(); $('cdBox').style.opacity = 0; $('holdBar').style.width = 0;
  drawStrip(sh, avg);
  if (avg >= 60) fire({colors: ['#ff3d81','#ffe23d','#3dffc0','#ffffff'], particleCount: 140, spread: 80, origin: {y: .6}});
  setTimeout(() => showModal(avg, '🎞️'), 450);
}
// 5 photo + 1 title tile: har photo alag frame me, beech me gap
function drawStrip(shots, avg) {
  const sc = $('snapCanvas'), c = sc.getContext('2d'), cw = 640, ch = 360, g = 28;
  sc.width = g * 3 + cw * 2; sc.height = g * 4 + ch * 3;
  c.fillStyle = '#2a1090'; c.fillRect(0, 0, sc.width, sc.height);
  c.fillStyle = 'rgba(255,255,255,.12)';
  for (let x = 13; x < sc.width; x += 26) for (let y = 13; y < sc.height; y += 26) { c.beginPath(); c.arc(x, y, 2, 0, 7); c.fill(); }
  const cell = i => [g + (i % 2) * (cw + g), g + Math.floor(i / 2) * (ch + g)];
  const frame = (x, y, fill) => { c.fillStyle = fill; c.fillRect(x - 8, y - 8, cw + 16, ch + 16); c.strokeStyle = '#000'; c.lineWidth = 5; c.strokeRect(x - 8, y - 8, cw + 16, ch + 16); };
  shots.forEach((s, i) => {
    const [x, y] = cell(i); frame(x, y, '#fff'); c.drawImage(s.img, x, y, cw, ch);
    const gr = c.createLinearGradient(0, y + ch * .75, 0, y + ch); gr.addColorStop(0, 'rgba(2,6,23,0)'); gr.addColorStop(1, 'rgba(2,6,23,.9)');
    c.fillStyle = gr; c.fillRect(x, y + ch * .75, cw, ch * .25);
    c.fillStyle = '#fff'; c.font = "34px 'Lilita One',sans-serif"; c.textAlign = 'left'; c.fillText(s.p.emoji + ' ' + s.p.name, x + 16, y + ch - 16);
    c.fillStyle = '#ff3d81'; c.beginPath(); c.roundRect(x + cw - 130, y + 14, 116, 56, 14); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = "40px 'Lilita One',sans-serif"; c.fillText(s.s + '%', x + cw - 72, y + 55);
    c.fillStyle = '#ffe23d'; c.beginPath(); c.arc(x + 38, y + 38, 26, 0, 7); c.fill(); c.strokeStyle = '#000'; c.lineWidth = 4; c.stroke();
    c.fillStyle = '#000'; c.font = "28px 'Lilita One',sans-serif"; c.fillText('#' + (i + 1), x + 38, y + 49);
  });
  const [x, y] = cell(5); frame(x, y, '#ff3d81');
  c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = "62px 'Lilita One',sans-serif"; c.fillText('MIRROR', x + cw / 2, y + 75); c.fillText('POSE-OFF', x + cw / 2, y + 140);
  c.fillStyle = '#ffe23d'; c.font = "110px 'Lilita One',sans-serif"; c.fillText(avg + '%', x + cw / 2, y + 250);
  c.fillStyle = '#fff'; c.font = "34px 'Lilita One',sans-serif"; c.fillText(($('playerName').value.trim() || 'Player').toUpperCase(), x + cw / 2, y + 305);
  c.font = "700 24px 'Space Grotesk',sans-serif"; c.fillText('COLLEGE FEST 2026', x + cw / 2, y + 345);
  c.textAlign = 'left';
}

// ---------- EVENTS ----------
window.addEventListener('DOMContentLoaded', () => {
  renderGrid(); renderLB(); startCamera();
  $('capBtn').onclick = () => startCountdown();
  $('boothBtn').onclick = () => booth ? stopBooth() : startBooth();
  $('refCam').onclick = () => {
    if (counting || modalOpen) return;
    const tp = POSES[sel];
    startCountdown(() => { counting = false; refSet(grab().toDataURL('image/jpeg', .8), tp); noSnapUntil = performance.now() + 3000; toast('📷 Reference photo lag gayi!'); });
  };
  $('refUp').onchange = e => {
    const f = e.target.files[0]; if (!f) return; const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 480 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); refSet(c.toDataURL('image/jpeg', .82)); toast('🖼 Photo lag gayi!');
    }; im.src = fr.result; };
    fr.readAsDataURL(f); e.target.value = '';
  };
  $('mkBtn').onclick = createPose; $('delBtn').onclick = deletePose;
  $('tabSolo').onclick = () => setTab('solo'); $('tabDuo').onclick = () => setTab('duo');
  $('retryBtn').onclick = () => startCamera();
  $('fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen();
  $('fillBtn').onclick = () => { const cb = contentBox(video.videoWidth || 1280, video.videoHeight || 720), cur = fillMode === null ? cb.h > cb.w : fillMode; fillMode = !cur; };
  $('demoBtn').onclick = () => mock ? startCamera() : startDemo();
  $('demoBtn2').onclick = startDemo;
  $('camSel').onchange = e => startCamera(e.target.value);
  $('xBtn').onclick = closeModal; $('nextBtn').onclick = () => { closeModal(); $('playerName').value = ''; $('playerName').focus(); };
  $('againBtn').onclick = closeModal; $('saveBtn').onclick = download;
  $('lbClear').onclick = () => { if (confirm('Poora leaderboard reset kar du?')) { LB = []; try { localStorage.removeItem(LB_KEY); } catch (e) {} renderLB(); } };
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') return booth ? stopBooth() : closeModal();
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName) || modalOpen) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); startCountdown(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (k === 'f') $('fsBtn').click();   // F = fullscreen
  else if (k === 'b') $('boothBtn').click(); // B = 5 pose challenge
});
</script>
